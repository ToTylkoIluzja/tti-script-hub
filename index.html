<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Baza ToTylkoIluzja</title>

    <link
    rel="stylesheet"
    href="style.css?v=1.1.0"
>
    >
</head>

<body>

    <header>

        <div class="wrap">

            <small>
                PLEMIONA • SCRIPT HUB
            </small>

            <h1>
                Baza ToTylkoIluzja
            </h1>

            <p>
                Centrum przechowywania i instalowania
                skryptów do Plemion.
            </p>

        </div>

    </header>


    <main class="wrap">

        <section class="toolbar">

            <input
                id="search"
                type="search"
                placeholder="Szukaj skryptu..."
                autocomplete="off"
            >

            <div id="cats"></div>

        </section>


        <div class="status">

            <div>
                <b id="count">0</b>
                skryptów
            </div>

            <span id="state">
                Ładowanie bazy...
            </span>

        </div>


        <section
            id="list"
            class="grid"
        ></section>

    </main>


    <footer>

        <div class="wrap">
            Baza ToTylkoIluzja • GitHub Pages
        </div>

    </footer>


    <script src="app.js"></script>

</body>
</html>
